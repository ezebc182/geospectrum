# openspec/config.yaml
schema: spec-driven

context: |
  Tech stack: Backend FastAPI (Python 3.11, src/) + Frontend Next.js 15 / React 19 (dashboard/, TS)
  Architecture: Adapters (USGS/INPRES/EMSC) + services + workers; SeedLink+Redis+WebSocket for live spectrograms
  Testing: Backend pytest (asyncio_mode=auto, coverage via pytest-cov); Frontend Vitest + Playwright
  Style: Backend black/ruff/mypy (line-length 100, strict typed); Frontend ESLint (eslint-config-next) + TS strict
  No CI pipeline detected (no .github/workflows)

rules:
  proposal:
    - Include rollback plan for risky changes
    # OJO: `src/workers/` NO EXISTE (verificado 2026-08-24). Lo que parece un
    # worker (el ingestor de SeedLink que puebla RSAM) vive en
    # src/services/seedlink_ingestor.py.
    - Identify affected modules/packages (backend src/{adapters,api,services} vs dashboard/{app,components,hooks,lib})
  specs:
    - Use Given/When/Then format for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows (esp. SeedLink/WebSocket/Redis pipelines)
    - Document architecture decisions with rationale
  tasks:
    - Group tasks by phase (infrastructure, implementation, testing)
    - Use hierarchical numbering (1.1, 1.2, etc.)
    - Keep tasks small enough to complete in one session
  apply:
    - Follow existing code patterns and conventions
    - Load relevant coding skills for the project stack
    tdd: false
    test_command: "cd seismic-monitor && pytest"
  verify:
    # El venv está en venv/ (NO .venv/): `pytest` pelado revienta con
    # ModuleNotFoundError de asyncpg.
    test_command: "./venv/bin/python -m pytest"
    # NUNCA `next build`: comparte el directorio .next con el server de dev y lo
    # rompe (ENOENT de vendor-chunks en la pantalla del usuario, con el server
    # corriendo). `tsc --noEmit` verifica los tipos sin escribir nada — probado
    # el 2026-08-24: exit 0 y `git status` sin cambios.
    # Nota: package.json no tiene script de tsc, por eso se invoca el binario.
    build_command: "cd dashboard && ./node_modules/.bin/tsc --noEmit"
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas (large removals)
