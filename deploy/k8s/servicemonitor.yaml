# ServiceMonitor para Prometheus Operator
# Solo aplicar si tienes Prometheus Operator instalado
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: geospectrum
  namespace: geospectrum
  labels:
    app: geospectrum
    release: prometheus  # Ajustar según tu release de Prometheus
spec:
  selector:
    matchLabels:
      app: geospectrum
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
