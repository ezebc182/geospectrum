# Kustomize para orquestar todos los manifests
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: geospectrum

resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml
  - ingress.yaml
  # - servicemonitor.yaml  # Descomentar si usas Prometheus Operator

# Labels comunes
labels:
  - includeSelectors: true
    pairs:
      project: geospectrum
      managed-by: kustomize

# Images (personalizar según tu registry)
images:
  - name: geospectrum
    newName: ghcr.io/your-org/geospectrum  # CAMBIAR
    newTag: latest
