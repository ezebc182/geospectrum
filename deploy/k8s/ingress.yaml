apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: geospectrum-ingress
  namespace: geospectrum
  annotations:
    # NGINX ingress
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"

    # Rate limiting (ajustar según necesidad)
    nginx.ingress.kubernetes.io/limit-rps: "10"

    # Timeouts
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "10"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "30"

    # CORS (si es necesario)
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"

    # TLS/SSL
    cert-manager.io/cluster-issuer: "letsencrypt-prod"  # Si usas cert-manager

spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - geospectrum.org
      secretName: geospectrum-tls
  rules:
    - host: geospectrum.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: geospectrum-service
                port:
                  number: 8000
