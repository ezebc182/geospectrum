apiVersion: v1
kind: Service
metadata:
  name: seismic-monitor-service
  namespace: seismic-monitor
  labels:
    app: seismic-monitor
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
      name: http
  selector:
    app: seismic-monitor

---
apiVersion: v1
kind: Service
metadata:
  name: inpres-adapter-service
  namespace: seismic-monitor
  labels:
    app: inpres-adapter
spec:
  type: ClusterIP
  ports:
    - port: 8001
      targetPort: 8001
      protocol: TCP
      name: http
  selector:
    app: inpres-adapter
