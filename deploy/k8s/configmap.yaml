apiVersion: v1
kind: ConfigMap
metadata:
  name: geospectrum-config
  namespace: geospectrum
data:
  # Región de monitoreo
  REGION_MINLAT: "-40"
  REGION_MAXLAT: "-20"
  REGION_MINLON: "-75"
  REGION_MAXLON: "-60"

  # Alertas
  MIN_MAG_ALERT: "3.0"
  WINDOW_MINUTES: "60"

  # Timeouts
  USGS_TIMEOUT_S: "5.0"
  INPRES_TIMEOUT_S: "5.0"

  # INPRES se consulta in-process contra su feed XML oficial. INPRES_PROXY_URL
  # sólo hace falta para apuntar a un proxy propio; sin ella funciona igual.

  # Logging
  LOG_LEVEL: "INFO"

  # Observability
  PROMETHEUS_ENABLED: "true"
