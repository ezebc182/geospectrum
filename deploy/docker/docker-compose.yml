version: '3.8'

# =============================================================================
# Docker Compose para GeoSpectrum
#
# Servicios:
# - geospectrum: API principal
# - inpres-adapter: Scraper INPRES (opcional)
# - prometheus: Métricas (opcional)
# - grafana: Dashboard (opcional)
# - timescaledb: Storage histórico (opcional)
# =============================================================================

services:
  # ===========================================================================
  # Servicio principal
  # ===========================================================================
  geospectrum:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    image: geospectrum:latest
    container_name: geospectrum
    ports:
      - "8000:8000"
    environment:
      # Region
      REGION_MINLAT: "-40"
      REGION_MAXLAT: "-20"
      REGION_MINLON: "-75"
      REGION_MAXLON: "-60"

      # Alertas
      MIN_MAG_ALERT: "3.0"
      WINDOW_MINUTES: "60"

      # Timeouts
      USGS_TIMEOUT_S: "5.0"
      INPRES_TIMEOUT_S: "5.0"

      # INPRES adapter
      INPRES_PROXY_URL: "http://inpres-adapter:8001/recent"

      # Logging
      LOG_LEVEL: "INFO"

      # Observability
      PROMETHEUS_ENABLED: "true"

      # Storage (descomentar si usas TimescaleDB)
      # TIMESCALEDB_HOST: "timescaledb"
      # TIMESCALEDB_PORT: "5432"
      # TIMESCALEDB_DB: "seismic"
      # TIMESCALEDB_USER: "seismic"
      # TIMESCALEDB_PASSWORD: "changeme"

      # Auth (multi-user-auth) — descomentar y setear un valor real para
      # habilitar /auth/*. Requiere TIMESCALEDB_* arriba también descomentado
      # y apuntando al servicio `timescaledb` (perfil `storage`), porque la
      # tabla `users` vive ahí, NO en un servicio nuevo. Antes de levantar
      # este servicio con AUTH_SECRET_KEY seteado, aplicar manualmente contra
      # ese Postgres las migraciones deploy/sql/migrations/001_create_users_table.sql
      # y deploy/sql/migrations/002_add_role_hierarchy.sql (no hay Alembic ni
      # migrador automático en este proyecto) — sin eso, AuthService falla en
      # cualquier query contra `users`. Generar un valor real con
      # `openssl rand -hex 32`; DEBE coincidir exactamente con
      # AUTH_SECRET_KEY en dashboard/.env.local (mismo secreto compartido
      # para firmar/verificar el JWT, ver dashboard/middleware.ts).
      # AUTH_SECRET_KEY: "change-me-in-production"
      # AUTH_TOKEN_EXPIRE_MINUTES: "1440"

      # Google OAuth (google-oauth) — extensión opcional de Auth arriba.
      # Requiere que AUTH_SECRET_KEY ya esté seteado (SessionMiddleware para
      # el state de OAuth reutiliza ese mismo secreto, ver src/main.py). Antes
      # de desplegar el código nuevo, aplicar manualmente contra el Postgres
      # del perfil `storage` la migración
      # deploy/sql/migrations/003_add_google_oauth.sql (mismo mecanismo que
      # 001/002 — no hay Alembic ni migrador automático), ya que agrega la
      # columna `google_id` y vuelve `password_hash` nullable. A diferencia de
      # AUTH_SECRET_KEY (fail-fast: si falta, el servidor NO arranca), estas
      # 3 variables son OPCIONALES al arranque: si faltan, el servidor
      # arranca igual con `google_oauth_configured=False`, los endpoints
      # `/auth/google/*` responden 503, y el login por password sigue
      # funcionando sin ninguna degradación. Obtener client ID/secret desde
      # Google Cloud Console (OAuth 2.0 Client IDs) y setear GOOGLE_REDIRECT_URI
      # apuntando a la URL pública de este servicio + `/auth/google/callback`.
      # GOOGLE_CLIENT_ID: "your-client-id.apps.googleusercontent.com"
      # GOOGLE_CLIENT_SECRET: "your-client-secret"
      # GOOGLE_REDIRECT_URI: "http://localhost:8000/auth/google/callback"

      # URL pública del dashboard — a diferencia de las 3 vars de arriba,
      # ESTA SÍ es obligatoria para que el login por Google no rompa: es el
      # destino final del 302 de /auth/google/callback (éxito y error). Sin
      # setearla explícitamente en producción, cae en el default de código
      # (http://localhost:3008, solo válido en dev local) y el usuario
      # termina viendo la respuesta JSON de esta API en vez de su sesión.
      # DASHBOARD_URL: "https://tu-dashboard.example.com"

    depends_on:
      - inpres-adapter
    restart: unless-stopped
    networks:
      - geospectrum-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 3s
      retries: 3

  # ===========================================================================
  # INPRES Adapter (scraper)
  # ===========================================================================
  inpres-adapter:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.inpres-adapter
    image: inpres-adapter:latest
    container_name: inpres-adapter
    ports:
      - "8001:8001"
    restart: unless-stopped
    networks:
      - geospectrum-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 3s
      retries: 3

  # ===========================================================================
  # Prometheus (opcional)
  # ===========================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    restart: unless-stopped
    networks:
      - geospectrum-net
    profiles:
      - observability

  # ===========================================================================
  # Grafana (opcional)
  # ===========================================================================
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_INSTALL_PLUGINS: ""
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - geospectrum-net
    profiles:
      - observability

  # ===========================================================================
  # TimescaleDB (opcional, para histórico)
  # ===========================================================================
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: timescaledb
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: seismic
      POSTGRES_USER: seismic
      POSTGRES_PASSWORD: changeme
    volumes:
      - timescaledb-data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - geospectrum-net
    profiles:
      - storage

networks:
  geospectrum-net:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:
  timescaledb-data:
